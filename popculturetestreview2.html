<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Culture Jeopardy</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    color: #006747;
    font-family: 'Georgia', serif;
    min-height: 100vh;
    padding: 24px 20px;
  }

  /* ── MASTHEAD ── */
  header {
    max-width: 980px;
    margin: 0 auto 20px;
    text-align: center;
  }

  .masthead-rule { border: none; border-top: 4px double #006747; margin-bottom: 8px; }

  .kicker {
    font-family: 'Georgia', serif;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1;
    color: #006747;
    letter-spacing: 1px;
  }

  .deck {
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    margin-top: 6px;
  }

  .masthead-rule-bottom { border: none; border-top: 4px double #006747; margin-top: 8px; }

  /* ── SCORE BAR ── */
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 16px auto;
    max-width: 980px;
  }

  .score-box {
    border: 2px solid #006747;
    background: #fff;
    padding: 8px 32px;
    text-align: center;
    min-width: 140px;
  }

  .score-box .label {
    font-family: 'Georgia', serif;
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
  }

  .score-box .value {
    font-family: 'Georgia', serif;
    font-size: 2rem;
    font-weight: 900;
    color: #006747;
  }

  /* ── BOARD ── */
  .board-wrap {
    max-width: 980px;
    margin: 0 auto 30px;
    border: 6px solid #006747;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0, 103, 71, 0.2);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    background: #006747;
    padding: 3px;
  }

  .cat-header {
    background: #006747;
    color: #FDE500;
    font-family: 'Georgia', serif;
    font-size: clamp(0.72rem, 1.3vw, 0.92rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.25;
    text-align: center;
    padding: 14px 8px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell {
    background: #fff;
    min-height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: clamp(1.3rem, 2.4vw, 1.75rem);
    font-weight: 900;
    color: #006747;
    border: 1px solid #ddd;
    transition: background 0.1s;
  }

  .cell:hover:not(.used) {
    background: #FDE500;
  }

  .cell.used {
    background: #e2ede7;
    color: transparent;
    cursor: default;
    border-color: #ccc;
  }

  /* ── MODAL ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .modal {
    background: #f5f0e8;
    border: 3px solid #006747;
    max-width: 660px;
    width: 100%;
    overflow: hidden;
  }

  .modal-top {
    background: #006747;
    color: #FDE500;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-top .cat-name {
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #bbb;
  }

  .modal-top .points {
    font-family: 'Georgia', serif;
    font-size: 1.6rem;
    font-weight: 900;
  }

  .modal-body { padding: 28px 26px 22px; }

  .clue-text {
    font-family: 'Georgia', serif;
    font-size: 1.15rem;
    line-height: 1.65;
    color: #006747;
    margin-bottom: 24px;
    text-align: center;
  }

  .answer-box {
    border: 2px solid #006747;
    background: #fff;
    padding: 16px 18px;
    margin-bottom: 20px;
    display: none;
  }

  .answer-box.show { display: block; }

  .answer-box .ans-label {
    font-family: 'Georgia', serif;
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 6px;
  }

  .answer-box .ans-text {
    font-family: 'Georgia', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #006747;
  }

  .answer-box .ans-explanation {
    font-family: 'Georgia', serif;
    font-size: 0.88rem;
    color: #444;
    margin-top: 8px;
    line-height: 1.6;
    font-style: italic;
    border-top: 1px solid #ddd;
    padding-top: 8px;
  }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Georgia', serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 2px solid #006747;
    cursor: pointer;
    background: #fff;
    color: #006747;
    transition: background 0.12s, color 0.12s;
  }

  button:hover { background: #006747; color: #FDE500; }

  .btn-correct { border-color: #2a6e3f; color: #2a6e3f; }
  .btn-correct:hover { background: #2a6e3f; color: #fff; }

  .btn-wrong { border-color: #8b1a1a; color: #8b1a1a; }
  .btn-wrong:hover { background: #8b1a1a; color: #fff; }

  .btn-skip { border-color: #999; color: #888; }
  .btn-skip:hover { background: #999; color: #fff; }

  /* ── END SCREEN ── */
  .end-screen {
    position: fixed; inset: 0;
    background: #f5f0e8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    z-index: 100;
    border: 10px double #006747;
    margin: 16px;
  }

  .end-screen.show { display: flex; }

  .end-screen .end-label {
    font-family: 'Georgia', serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 10px;
  }

  .end-screen h2 {
    font-family: 'Georgia', serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 900;
    color: #006747;
    margin-bottom: 10px;
  }

  .end-screen .final {
    font-family: 'Georgia', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 700;
    color: #006747;
    margin-bottom: 6px;
  }

  .end-screen .grade {
    font-family: 'Georgia', serif;
    font-size: 1rem;
    font-style: italic;
    color: #444;
    max-width: 420px;
    line-height: 1.6;
    margin-bottom: 32px;
    border-top: 1px solid #bbb;
    border-bottom: 1px solid #bbb;
    padding: 12px 0;
  }

  .btn-restart {
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 12px 36px;
    background: #006747;
    color: #FDE500;
    border: 2px solid #006747;
  }

  .btn-restart:hover { background: #444; }

  @media (max-width: 580px) {
    .cell { min-height: 54px; }
    .cat-header { min-height: 52px; padding: 8px 4px; }
    .score-box { padding: 8px 16px; min-width: 100px; }
  }
</style>
</head>
<body>

<!-- ── MASTHEAD ── -->
<header>
  <hr class="masthead-rule">
  <div class="kicker">Created by Matt Cohen - UT Austin</div>
  <h1>Pop Culture Jeopardy</h1>
  <!-- ✏️ Change your subtitle/topic below -->
  <div class="deck">Test 2 Review</div>
  <hr class="masthead-rule-bottom">
</header>

<!-- ── SCORE ── -->
<div class="score-bar" style="flex-wrap: wrap;">
  <div class="score-box">
    <div class="label">Team 1</div>
    <div class="value" id="score-0">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 2</div>
    <div class="value" id="score-1">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 3</div>
    <div class="value" id="score-2">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 4</div>
    <div class="value" id="score-3">$0</div>
  </div>
</div>

<!-- ── BOARD ── -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- ── END SCREEN ── -->
<div class="end-screen" id="endScreen">
  <div class="end-label">Final Results</div>
  <h2>Game Over</h2>
  <div class="final" id="finalScore"></div>
  <div class="grade" id="grade"></div>
  <button class="btn-restart" onclick="restart()">Play Again</button>
</div>

<script>

// ============================================================
//  ✏️  YOUR CONTENT — EDIT HERE
// ============================================================
//
//  5 categories · 5 clues each · values: 200 / 400 / 600 / 800 / 1000
//  Leave explanation as "" if you don't need the extra context line.
//
// ============================================================

const CATEGORIES = [

  {
    name: "Music & Media",
    clues: [
      { value: 200,  clue: "When community groups argue that explicit rap or metal lyrics will corrupt local youth—while insisting they themselves are completely immune to harm—they are exhibiting this psychological phenomenon.", answer: "What is Third-Person Perception?" },
      { value: 400,  clue: "When defense lawyers argue in court that violent rap lyrics represent artistic storytelling rather than literal criminal confessions, they often cite this country icon's famous song about shooting a man in Reno.", answer: "Who is Johnny Cash? (or the \"Johnny Cash Defense\")" },
      { value: 600,  clue: "Although frequently played at patriotic political rallies, songs like Bruce Springsteen's \"Born in the USA\" and Neil Young's \"Keep on Rockin' in the Free World\" share this common cultural fate.", answer: "What is being widely misinterpreted as patriotic anthems? (rather than social/political critiques)" },
      { value: 800,  clue: "Because modern digital technology allows thousands of niche music sub-genres to flourish, record labels face this major marketing hurdle where no single, unified mass market exists.", answer: "What is audience fragmentation?" },
      { value: 1000, clue: "While the First Amendment broadly protects offensive, profane, or controversial song lyrics, it explicitly does NOT extend protection to this specific type of speech.", answer: "What are credible threats of harm or death? (or imminent violent threats)" }
    ]
  },

  {
    name: "Food & Globalization",
    clues: [
      { value: 200,  clue: "This Western movement promoting local, organic, and traditional dining inadvertently drove multinational corporations to expand processed food sales into developing nations.", answer: "What is the Slow Food Movement?" },
      { value: 400,  clue: "While television displays endless culinary options, real-world American dining is heavily shaped by this sociological concept, which prioritizes standardized meals and maximum efficiency.", answer: "What is McDonaldization?" },
      { value: 600,  clue: "In developing nations like Ghana, purchasing Western fast food or processed convenience snacks is often viewed by local consumers as a symbol of this.", answer: "What is high social class? (or upward economic status)" },
      { value: 800,  clue: "Media research highlights food television as a pop culture genre that stands out for being unusually inclusive and representative across these two social dimensions.", answer: "What are race and social class?" },
      { value: 1000, clue: "When multinational corporations outbid local markets for crops like sugarcane or defeat legislation restricting fast-food ads, it illustrates this major dimension of food culture.", answer: "What is the economic and political dimension?" }
    ]
  },

  {
    name: "Sports & Society",
    clues: [
      { value: 200,  clue: "The belief that athletics should remain strictly focused on physical competition and kept entirely separate from political commentary or civil rights reflects this traditional philosophy.", answer: "What is the Neutrality Vision of sports?" },
      { value: 400,  clue: "High-profile athletes who utilize their public platforms to advocate for civil rights and social reform—such as Colin Kaepernick or Tommie Smith—embody this movement.", answer: "What is \"Jocks for Justice\"?" },
      { value: 600,  clue: "Competitive sports and democratic governance share a core reliance on this philosophy, where individual success is supposed to be earned through talent and effort rather than inherited privilege.", answer: "What is meritocracy?" },
      { value: 800,  clue: "When sports broadcasters attribute white athletes' success to \"intellect and strategy\" while describing Black athletes solely through \"natural physical gifts,\" they are engaging in this media issue.", answer: "What are linguistic microaggressions? (or racial stereotyping)" },
      { value: 1000, clue: "Host governments frequently spend billions of dollars on international mega-events like the Olympic Games primarily to achieve these objectives on the world stage.", answer: "What are political purposes? (such as showcasing political legitimacy or state power)" }
    ]
  },

  {
    name: "Travel Media",
    clues: [
      { value: 200,  clue: "Foreign news coverage that only dispatches journalists to developing nations during sudden natural disasters or violent political upheavals is criticized for this style of reporting.", answer: "What is \"coups and earthquakes\" reporting?" },
      { value: 400,  clue: "Rather than serving as promotional consumer guides that simply evaluate hotel rates and vacation activities, travel journalism seeks to inform audiences by providing this broader context.", answer: "What is historical, economic, social, and cultural context?" },
      { value: 600,  clue: "When travel shows like <em>United Shades of America</em> or <em>Parts Unknown</em> explore places like Appalachian coal country or Houston's immigrant communities, they distinguish themselves by giving voice to residents and focusing on this aspect of local life.", answer: "What are their actual living conditions and socio-economic realities?" },
      { value: 800,  clue: "When state tourism departments offer free flights, luxury lodging, and meals to journalists covering a destination, media ethicists argue that accepting this state funding creates this ethical violation.", answer: "What is a conflict of interest? (or compromise of journalistic independence)" },
      { value: 1000, clue: "Rather than traveling to distant foreign countries, reporters practicing \"localizing travel journalism\" explore diverse subcultures in their own regions by approaching local residents with these principles.", answer: "What are empathy, respect, and cultural understanding?" }
    ]
  },

  {
    name: "Panics & Research",
    clues: [
      { value: 200,  clue: "Public outrage surrounding controversial media trends—such as visible tattoos, jazz dancing, or video game violence—typically follows a moral panic pattern that ends in this long-term state.", answer: "What is becoming accepted or normalized into mainstream culture?" },
      { value: 400,  clue: "In an academic research article, stating that a finding showed a \"statistically significant difference\" specifically means this.", answer: "What is the result was unlikely to have occurred by chance?" },
      { value: 600,  clue: "This theoretical framework in gender studies looks beyond traditional binaries to examine how markers of gender, race, and social class intersect and blur in digital culture.", answer: "What is post-feminist theory?" },
      { value: 800,  clue: "Media scholars like Danesi trace the early 20th-century pop culture roots of female bodily independence and youth subculture back to this 1920s movement.", answer: "What is flapper culture?" },
      { value: 1000, clue: "In a published research paper, the specific section that details <em>how</em> data was collected—such as through surveys, laboratory experiments, or interviews—is called this.", answer: "What is the Methods section?" }
    ]
  }

];

// ✏️ End-of-game messages — edit to taste
function gradePlayer(score) {
  if (score >= 8000) return "Outstanding. Top of the class.";
  if (score >= 5000) return "Strong performance — well studied.";
  if (score >= 2000) return "Decent effort. Review your notes.";
  if (score >= 0)    return "Keep practicing — hit the textbook.";
  return "Back to square one. Try again.";
}

// ============================================================
//  🔧  GAME ENGINE — no need to edit below here
// ============================================================

let scores = [0, 0, 0, 0];
let used = 0;
const total = 25;
let active = null;

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  CATEGORIES.forEach(c => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = c.name;
    board.appendChild(h);
  });
  for (let row = 0; row < 5; row++) {
    CATEGORIES.forEach((cat, col) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = '$' + cat.clues[row].value;
      cell.addEventListener('click', () => openClue(col, row, cell));
      board.appendChild(cell);
    });
  }
}

function openClue(col, row, cell) {
  if (cell.classList.contains('used')) return;
  const clue = CATEGORIES[col].clues[row];
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-top">
        <span class="cat-name">${CATEGORIES[col].name}</span>
        <span class="points">$${clue.value}</span>
      </div>
      <div class="modal-body">
        <div class="clue-text">${clue.clue}</div>
        <div class="answer-box" id="ansBox">
          <div class="ans-label">Answer</div>
          <div class="ans-text">${clue.answer}</div>
          ${clue.explanation ? `<div class="ans-explanation">${clue.explanation}</div>` : ''}
        </div>
        <div class="btn-row" id="btnRow">
          <button onclick="reveal()">Check Answer</button>
          <button class="btn-skip" onclick="skip()">Pass</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  active = { overlay, cell, clue };
}

function reveal() {
  document.getElementById('ansBox').classList.add('show');
  document.getElementById('btnRow').innerHTML = `
    <div style="width:100%;text-align:center;margin-bottom:8px;font-size:0.75rem;text-transform:uppercase;color:#555;letter-spacing:2px;font-weight:700;">Award Points To:</div>
    <button class="btn-correct" onclick="assignTeam(0)">Team 1</button>
    <button class="btn-correct" onclick="assignTeam(1)">Team 2</button>
    <button class="btn-correct" onclick="assignTeam(2)">Team 3</button>
    <button class="btn-correct" onclick="assignTeam(3)">Team 4</button>
    <button class="btn-wrong" onclick="assignTeam(-1)">Nobody</button>`;
}

function assignTeam(teamIndex) {
  const { overlay, cell, clue } = active;
  cell.classList.add('used');
  used++;
  
  if (teamIndex >= 0) {
    scores[teamIndex] += clue.value;
    document.getElementById('score-' + teamIndex).textContent =
      (scores[teamIndex] < 0 ? '-$' : '$') + Math.abs(scores[teamIndex]).toLocaleString();
  }
  
  document.body.removeChild(overlay);
  active = null;
  if (used === total) setTimeout(end, 400);
}

function skip() {
  active.cell.classList.add('used');
  used++;
  document.body.removeChild(active.overlay);
  active = null;
  if (used === total) setTimeout(end, 400);
}

function end() {
  let maxScore = Math.max(...scores);
  let winners = [];
  scores.forEach((s, i) => { if (s === maxScore) winners.push('Team ' + (i+1)); });
  
  document.getElementById('finalScore').textContent = 
    winners.join(' & ') + ' win(s) with ' + (maxScore < 0 ? '-$' : '$') + Math.abs(maxScore).toLocaleString() + '!';
    
  document.getElementById('grade').textContent = gradePlayer(maxScore);
  document.getElementById('endScreen').classList.add('show');
}

function restart() {
  scores = [0, 0, 0, 0]; used = 0; active = null;
  for(let i=0; i<4; i++) {
    document.getElementById('score-' + i).textContent = '$0';
  }
  document.getElementById('endScreen').classList.remove('show');
  buildBoard();
}

buildBoard();
</script>
</body>
</html>
