<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pop Culture Jeopardy</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #f5f0e8;
    color: #006747;
    font-family: 'Georgia', serif;
    min-height: 100vh;
    padding: 24px 20px;
  }

  /* ── MASTHEAD ── */
  header {
    max-width: 980px;
    margin: 0 auto 20px;
    text-align: center;
  }

  .masthead-rule { border: none; border-top: 4px double #006747; margin-bottom: 8px; }

  .kicker {
    font-family: 'Georgia', serif;
    font-size: 0.7rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #555;
    margin-bottom: 6px;
  }

  h1 {
    font-family: 'Georgia', serif;
    font-size: clamp(2.2rem, 6vw, 3.8rem);
    font-weight: 900;
    line-height: 1;
    color: #006747;
    letter-spacing: 1px;
  }

  .deck {
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    margin-top: 6px;
  }

  .masthead-rule-bottom { border: none; border-top: 4px double #006747; margin-top: 8px; }

  /* ── SCORE BAR ── */
  .score-bar {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 16px auto;
    max-width: 980px;
  }

  .score-box {
    border: 2px solid #006747;
    background: #fff;
    padding: 8px 32px;
    text-align: center;
    min-width: 140px;
  }

  .score-box .label {
    font-family: 'Georgia', serif;
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #666;
  }

  .score-box .value {
    font-family: 'Georgia', serif;
    font-size: 2rem;
    font-weight: 900;
    color: #006747;
  }

  /* ── BOARD ── */
  .board-wrap {
    max-width: 980px;
    margin: 0 auto 30px;
    border: 6px solid #006747;
    border-radius: 4px;
    box-shadow: 0 4px 16px rgba(0, 103, 71, 0.2);
  }

  .board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 3px;
    background: #006747;
    padding: 3px;
  }

  .cat-header {
    background: #006747;
    color: #FDE500;
    font-family: 'Georgia', serif;
    font-size: clamp(0.72rem, 1.3vw, 0.92rem);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    line-height: 1.25;
    text-align: center;
    padding: 14px 8px;
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .cell {
    background: #fff;
    min-height: 74px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-family: 'Georgia', serif;
    font-size: clamp(1.3rem, 2.4vw, 1.75rem);
    font-weight: 900;
    color: #006747;
    border: 1px solid #ddd;
    transition: background 0.1s;
  }

  .cell:hover:not(.used) {
    background: #FDE500;
  }

  .cell.used {
    background: #e2ede7;
    color: transparent;
    cursor: default;
    border-color: #ccc;
  }

  /* ── MODAL ── */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }

  .modal {
    background: #f5f0e8;
    border: 3px solid #006747;
    max-width: 660px;
    width: 100%;
    overflow: hidden;
  }

  .modal-top {
    background: #006747;
    color: #FDE500;
    padding: 14px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-top .cat-name {
    font-family: 'Georgia', serif;
    font-size: 0.72rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #bbb;
  }

  .modal-top .points {
    font-family: 'Georgia', serif;
    font-size: 1.6rem;
    font-weight: 900;
  }

  .modal-body { padding: 28px 26px 22px; }

  .clue-text {
    font-family: 'Georgia', serif;
    font-size: 1.15rem;
    line-height: 1.65;
    color: #006747;
    margin-bottom: 24px;
    text-align: center;
  }

  .answer-box {
    border: 2px solid #006747;
    background: #fff;
    padding: 16px 18px;
    margin-bottom: 20px;
    display: none;
  }

  .answer-box.show { display: block; }

  .answer-box .ans-label {
    font-family: 'Georgia', serif;
    font-size: 0.62rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 6px;
  }

  .answer-box .ans-text {
    font-family: 'Georgia', serif;
    font-size: 1.1rem;
    font-weight: 700;
    color: #006747;
  }

  .answer-box .ans-explanation {
    font-family: 'Georgia', serif;
    font-size: 0.88rem;
    color: #444;
    margin-top: 8px;
    line-height: 1.6;
    font-style: italic;
    border-top: 1px solid #ddd;
    padding-top: 8px;
  }

  /* ── BUTTONS ── */
  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    font-family: 'Georgia', serif;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 24px;
    border: 2px solid #006747;
    cursor: pointer;
    background: #fff;
    color: #006747;
    transition: background 0.12s, color 0.12s;
  }

  button:hover { background: #006747; color: #FDE500; }

  .btn-correct { border-color: #2a6e3f; color: #2a6e3f; }
  .btn-correct:hover { background: #2a6e3f; color: #fff; }

  .btn-wrong { border-color: #8b1a1a; color: #8b1a1a; }
  .btn-wrong:hover { background: #8b1a1a; color: #fff; }

  .btn-skip { border-color: #999; color: #888; }
  .btn-skip:hover { background: #999; color: #fff; }

  /* ── END SCREEN ── */
  .end-screen {
    position: fixed; inset: 0;
    background: #f5f0e8;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px;
    z-index: 100;
    border: 10px double #006747;
    margin: 16px;
  }

  .end-screen.show { display: flex; }

  .end-screen .end-label {
    font-family: 'Georgia', serif;
    font-size: 0.7rem;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #777;
    margin-bottom: 10px;
  }

  .end-screen h2 {
    font-family: 'Georgia', serif;
    font-size: clamp(2rem, 6vw, 3.4rem);
    font-weight: 900;
    color: #006747;
    margin-bottom: 10px;
  }

  .end-screen .final {
    font-family: 'Georgia', serif;
    font-size: clamp(1.4rem, 4vw, 2.2rem);
    font-weight: 700;
    color: #006747;
    margin-bottom: 6px;
  }

  .end-screen .grade {
    font-family: 'Georgia', serif;
    font-size: 1rem;
    font-style: italic;
    color: #444;
    max-width: 420px;
    line-height: 1.6;
    margin-bottom: 32px;
    border-top: 1px solid #bbb;
    border-bottom: 1px solid #bbb;
    padding: 12px 0;
  }

  .btn-restart {
    font-family: 'Georgia', serif;
    font-size: 0.9rem;
    letter-spacing: 2px;
    padding: 12px 36px;
    background: #006747;
    color: #FDE500;
    border: 2px solid #006747;
  }

  .btn-restart:hover { background: #444; }

  @media (max-width: 580px) {
    .cell { min-height: 54px; }
    .cat-header { min-height: 52px; padding: 8px 4px; }
    .score-box { padding: 8px 16px; min-width: 100px; }
  }
</style>
</head>
<body>

<!-- ── MASTHEAD ── -->
<header>
  <hr class="masthead-rule">
  <div class="kicker">Created by Matt Cohen - UT Austin</div>
  <h1>Pop Culture Jeopardy</h1>
  <!-- ✏️ Change your subtitle/topic below -->
  <div class="deck">Test 2 Review</div>
  <hr class="masthead-rule-bottom">
</header>

<!-- ── SCORE ── -->
<div class="score-bar" style="flex-wrap: wrap;">
  <div class="score-box">
    <div class="label">Team 1</div>
    <div class="value" id="score-0">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 2</div>
    <div class="value" id="score-1">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 3</div>
    <div class="value" id="score-2">$0</div>
  </div>
  <div class="score-box">
    <div class="label">Team 4</div>
    <div class="value" id="score-3">$0</div>
  </div>
</div>

<!-- ── BOARD ── -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- ── END SCREEN ── -->
<div class="end-screen" id="endScreen">
  <div class="end-label">Final Results</div>
  <h2>Game Over</h2>
  <div class="final" id="finalScore"></div>
  <div class="grade" id="grade"></div>
  <button class="btn-restart" onclick="restart()">Play Again</button>
</div>

<script>

// ============================================================
//  ✏️  YOUR CONTENT — EDIT HERE
// ============================================================
//
//  5 categories · 5 clues each · values: 200 / 400 / 600 / 800 / 1000
//  Leave explanation as "" if you don't need the extra context line.
//
// ============================================================

const CATEGORIES = [

  {
    name: "Food, Media & Society",
    clues: [
      { value: 200,  clue: "Opposing the convenience and standardized speed of fast-food culture, this international movement advocates for locally sourced ingredients, organic farming, and preserving regional culinary traditions.", answer: "What is the Slow Food Movement?" },
      { value: 400,  clue: "While early cooking shows focused on instructional recipes and home cooking techniques, modern food television primarily shifts toward visual style, charismatic personalities, and sensory spectacle—a trend often termed \"food porn.\"", answer: "What is culinary spectacle? (or lifestyle TV)" },
      { value: 600,  clue: "When global food corporations expand aggressively into developing nations to offset declining profits in Western markets, it frequently triggers this dual health crisis where populations become both overweight and undernourished.", answer: "What is obesity? (or the \"new malnutrition\")" },
      { value: 800,  clue: "Sociologist George Ritzer coined this term to describe how modern society prioritizes efficiency, predictability, and loss of personal choice through standardized consumption.", answer: "What is McDonaldization?" },
      { value: 1000, clue: "Food shows featuring figures like Snoop Dogg cooking alongside Martha Stewart, or prison chefs publishing cookbooks, illustrate this process of breaking down traditional elite barriers in culinary media.", answer: "What is democratizing food culture?" }
    ]
  },

  {
    name: "The Beat of Change",
    clues: [
      { value: 200,  clue: "Before the late 1800s invention of the phonograph, listening to music required live attendance or home performance; today, digital technology has driven this total shift toward universal availability.", answer: "What is the democratization of music? (or technological access)" },
      { value: 400,  clue: "During the 1985 Senate hearings spearheaded by the Parents Music Resource Center (PMRC), artists like Frank Zappa defended free speech against the mandatory adoption of these store warnings.", answer: "What are Parental Advisory labels? (or warning stickers)" },
      { value: 600,  clue: "While song lyrics enjoy broad First Amendment protections, speech loses legal immunity if it constitutes this explicit type of statement.", answer: "What is a credible threat of violence? (or incitement to lawless action)" },
      { value: 800,  clue: "Historical anthems like Woody Guthrie's \"This Land Is Your Land\" and Public Enemy's \"Fight the Power\" belong to this genre intended to challenge systemic authority and social injustice.", answer: "What are social protest songs?" },
      { value: 1000, clue: "While artists were historically accused of \"selling out\" when partnering with corporations, modern figures like Jay-Z are instead praised for this entrepreneurial redefinition of artistic success.", answer: "What is commercial success? (or corporate brand partnership)" }
    ]
  },

  {
    name: "More Than a Game",
    clues: [
      { value: 200,  clue: "The belief that sports should function purely as an athletic competition isolated from social commentary, activism, or political issues is known as this perspective.", answer: "What is the Neutrality Vision of Sport?" },
      { value: 400,  clue: "Tommie Smith and John Carlos raising gloved fists at the 1968 Olympics, and Colin Kaepernick kneeling during the national anthem in 2016, are landmark examples of athletes using their platform for this.", answer: "What is social protest? (or civil rights activism)" },
      { value: 600,  clue: "Public tax dollars funding stadium construction and the mandatory playing of national anthems before games prove that sports are inherently bound to this.", answer: "What is politics? (or political institutions)" },
      { value: 800,  clue: "When sports broadcasters attribute Black athletes' success primarily to physical talent while praising white athletes for intelligence and leadership, they engage in these subtle forms of media bias.", answer: "What are microaggressions? (or modern stereotyping)" },
      { value: 1000, clue: "Following the fall of Apartheid, Nelson Mandela strategically used South Africa's national team during the 1995 Rugby World Cup to achieve this national goal.", answer: "What is national unity? (or racial reconciliation)" }
    ]
  },

  {
    name: "Media Mind Games & Panics",
    clues: [
      { value: 200,  clue: "When a person believes that violent video games or explicit music lyrics easily corrupt other people's children while having zero influence on themselves, they exhibit this psychological concept.", answer: "What is the Third-Person Perception? (or Effect)" },
      { value: 400,  clue: "Widespread cultural alarms over new youth trends—such as Elvis Presley's dance moves in the 1950s or TikTok trends today—typically start as panics before following this long-term path.", answer: "What is normalization? (or social acceptance)" },
      { value: 600,  clue: "This independent federal body holds legal jurisdiction over regulating public broadcast airwaves, television, radio, and communications infrastructure in the U.S.", answer: "What is the FCC? (Federal Communications Commission)" },
      { value: 800,  clue: "In academic media studies, stating that a finding between survey groups is \"statistically significant\" specifically means the outcome was not produced by this.", answer: "What is chance? (or random probability)" },
      { value: 1000, clue: "An intense, collective overreaction by society to a new media form or youth behavior based on fears that it will destroy moral standards is known as this.", answer: "What is a moral panic?" }
    ]
  },

  {
    name: "Travel, Tropes & Representation",
    clues: [
      { value: 200,  clue: "Media critics use this phrase to describe news organizations that only report on foreign or developing nations during times of war, natural disaster, or political crisis.", answer: "What is \"coups and earthquakes\" journalism?" },
      { value: 400,  clue: "In <em>Parts Unknown</em>, Anthony Bourdain distinguished his travel coverage by using regional meals as an entry point to explore these deeper societal factors.", answer: "What are history, politics, and social issues? (or cultural context)" },
      { value: 600,  clue: "Groundbreaking 1990s TV characters like single-mother Murphy Brown fulfilled an educational media role by normalizing evolving societal views on these.", answer: "What are sexual mores and family structures?" },
      { value: 800,  clue: "Media tropes like the \"Latin Lover\" reduce characters of color to narrow sexual caricatures, illustrating this historic pattern of racial bias.", answer: "What is hypersexualization?" },
      { value: 1000, clue: "Unlike traditional feminism's critique of the \"male gaze,\" this modern theoretical framework views female artists using their sexuality as an active form of self-empowerment and liberation.", answer: "What is post-feminist theory?" }
    ]
  }

];

// ✏️ End-of-game messages — edit to taste
function gradePlayer(score) {
  if (score >= 8000) return "Outstanding. Top of the class.";
  if (score >= 5000) return "Strong performance — well studied.";
  if (score >= 2000) return "Decent effort. Review your notes.";
  if (score >= 0)    return "Keep practicing — hit the textbook.";
  return "Back to square one. Try again.";
}

// ============================================================
//  🔧  GAME ENGINE — no need to edit below here
// ============================================================

let scores = [0, 0, 0, 0];
let used = 0;
const total = 25;
let active = null;

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  CATEGORIES.forEach(c => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.textContent = c.name;
    board.appendChild(h);
  });
  for (let row = 0; row < 5; row++) {
    CATEGORIES.forEach((cat, col) => {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.textContent = '$' + cat.clues[row].value;
      cell.addEventListener('click', () => openClue(col, row, cell));
      board.appendChild(cell);
    });
  }
}

function openClue(col, row, cell) {
  if (cell.classList.contains('used')) return;
  const clue = CATEGORIES[col].clues[row];
  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="modal">
      <div class="modal-top">
        <span class="cat-name">${CATEGORIES[col].name}</span>
        <span class="points">$${clue.value}</span>
      </div>
      <div class="modal-body">
        <div class="clue-text">${clue.clue}</div>
        <div class="answer-box" id="ansBox">
          <div class="ans-label">Answer</div>
          <div class="ans-text">${clue.answer}</div>
          ${clue.explanation ? `<div class="ans-explanation">${clue.explanation}</div>` : ''}
        </div>
        <div class="btn-row" id="btnRow">
          <button onclick="reveal()">Check Answer</button>
          <button class="btn-skip" onclick="skip()">Pass</button>
        </div>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  active = { overlay, cell, clue };
}

function reveal() {
  document.getElementById('ansBox').classList.add('show');
  document.getElementById('btnRow').innerHTML = `
    <div style="width:100%;text-align:center;margin-bottom:8px;font-size:0.75rem;text-transform:uppercase;color:#555;letter-spacing:2px;font-weight:700;">Award Points To:</div>
    <button class="btn-correct" onclick="assignTeam(0)">Team 1</button>
    <button class="btn-correct" onclick="assignTeam(1)">Team 2</button>
    <button class="btn-correct" onclick="assignTeam(2)">Team 3</button>
    <button class="btn-correct" onclick="assignTeam(3)">Team 4</button>
    <button class="btn-wrong" onclick="assignTeam(-1)">Nobody</button>`;
}

function assignTeam(teamIndex) {
  const { overlay, cell, clue } = active;
  cell.classList.add('used');
  used++;
  
  if (teamIndex >= 0) {
    scores[teamIndex] += clue.value;
    document.getElementById('score-' + teamIndex).textContent =
      (scores[teamIndex] < 0 ? '-$' : '$') + Math.abs(scores[teamIndex]).toLocaleString();
  }
  
  document.body.removeChild(overlay);
  active = null;
  if (used === total) setTimeout(end, 400);
}

function skip() {
  active.cell.classList.add('used');
  used++;
  document.body.removeChild(active.overlay);
  active = null;
  if (used === total) setTimeout(end, 400);
}

function end() {
  let maxScore = Math.max(...scores);
  let winners = [];
  scores.forEach((s, i) => { if (s === maxScore) winners.push('Team ' + (i+1)); });
  
  document.getElementById('finalScore').textContent = 
    winners.join(' & ') + ' win(s) with ' + (maxScore < 0 ? '-$' : '$') + Math.abs(maxScore).toLocaleString() + '!';
    
  document.getElementById('grade').textContent = gradePlayer(maxScore);
  document.getElementById('endScreen').classList.add('show');
}

function restart() {
  scores = [0, 0, 0, 0]; used = 0; active = null;
  for(let i=0; i<4; i++) {
    document.getElementById('score-' + i).textContent = '$0';
  }
  document.getElementById('endScreen').classList.remove('show');
  buildBoard();
}

buildBoard();
</script>
</body>
</html>
